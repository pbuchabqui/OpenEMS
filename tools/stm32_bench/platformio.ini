; Bancada OpenEMS em STM32H562RGT6 (WeAct 64 pinos): gerador CKP/CMP + sensores + scope.
; Build:   pio run -e weact_h562rg
; Upload:  pio run -e weact_h562rg -t upload   (DFU/ST-Link, conforme a placa)
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = weact_h562rg

[env:weact_h562rg]
platform = ststm32
board = weact_stm32h5
framework = arduino
board_build.variant = STM32H5xx/H562R(G-I)T
board_build.arduino.variant_h = variant_WEACT_H562RG.h
monitor_speed = 115200
build_flags =
    -DARDUINO_WEACT_H562RG
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DHAL_PCD_MODULE_ENABLED
    -DUSBD_VID=0x0483
    -DUSBD_PID=0x5740
    -Wl,-u,_printf_float
